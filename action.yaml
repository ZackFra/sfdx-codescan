name: SFDX CodeScan
description: Run a Salesforce CodeScan and raise warnings based on severity
author: Zackary Frazier


inputs:
  max-severity:
    description: 'Maximum severity to fail the build [0-5]'
    required: false
    default: 5
    type: number

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '26'
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - name: Move Directories
      shell: bash
      run: |
        node ${{ github.action_path }}/.scripts/js/move-directories.js
    - name: Code Scan, Raise warnings
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci
        npm i -g @salesforce/cli
        sf --version
        java -version
        sf plugins install @salesforce/plugin-code-analyzer
        sf code-analyzer run --workspace . --output-file codescan.json --rule-selector pmd --rule-selector eslint --rule-selector retire-js --rule-selector cpd --rule-selector regex
        node .scripts/js/raise-warnings.js ${{ inputs.max-severity }}
